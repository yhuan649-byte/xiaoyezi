<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6fafd"><meta name="description" content="晴间来信，一本可以随身携带的角色与光影收藏册。"><title>晴间来信 · 角色图鉴</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><script src="characters.js" defer></script><script src="app.js" defer></script></head>
<body><a class="skip-link" href="#main">跳到内容</a><div id="sky" aria-hidden="true"></div><div id="light-trail" aria-hidden="true"></div>
<header class="header"><a href="#leaf" class="brand"><span class="brand-mark">晴</span><span>晴间来信<small>把喜欢的瞬间，留在这里。</small></span></a><div class="header-actions"><button id="search-open" aria-label="搜索角色与故事">⌕ <span>搜索</span></button><button id="explore">✧ <span>探索</span></button><button id="collection">♡ <span>收藏</span><b id="count">0</b></button><button id="settings" aria-label="打开阅读设置">☷ <span>设置</span></button></div></header>
<main id="main" tabindex="-1"><div id="recommendation" hidden></div><div class="intro"><p>在光落下的地方，遇见你。</p><button id="daily-encounter">✦ 今日相遇</button></div><nav id="characters" role="tablist" aria-label="选择角色"></nav>
<div id="character-view"><section class="stage" id="character-panel" role="tabpanel"><div class="art-wrap"><button class="art" id="open-art" aria-label="打开原图鉴赏"><span class="film-loader" aria-hidden="true"></span><img id="hero" fetchpriority="high" alt=""><span class="art-flash" aria-hidden="true"></span><span class="art-shade"></span><span class="art-caption"><span id="scene"></span><small>轻触画面 · 沉浸鉴赏</small></span><span class="view-mark">⤢</span></button><div class="image-error" hidden>画面暂未载入，请检查图片文件后重试。<button id="retry">重新加载</button></div><div class="art-footer"><span id="image-count"></span><div><button id="prev" aria-label="上一幅">‹</button><button id="next" aria-label="下一幅">›</button></div></div></div>
<article class="profile"><div class="profile-top"><span id="mood"></span><button id="favorite" aria-label="收藏角色" aria-pressed="false">♡</button></div><div class="name-line"><h1 id="name"></h1><button id="daily-label" hidden>✦ 今日相遇</button></div><p id="subtitle" class="subtitle"></p><div class="quote-row"><blockquote id="quote"></blockquote><button id="speak" aria-label="朗读角色台词">♬</button></div><div class="content-tabs" role="tablist" aria-label="档案内容"><button role="tab" aria-selected="true" data-pane="story" id="tab-story" aria-controls="pane-story">角色手记</button><button role="tab" aria-selected="false" data-pane="details" id="tab-details" aria-controls="pane-details" tabindex="-1">印象档案</button><button role="tab" aria-selected="false" data-pane="related" id="tab-related" aria-controls="pane-related" tabindex="-1">相关角色</button></div><div class="paper-content"><div id="pane-story" class="pane" role="tabpanel" aria-labelledby="tab-story"><p id="story"></p><div id="tags"></div></div><div id="pane-details" class="pane" role="tabpanel" aria-labelledby="tab-details" hidden><dl id="details"></dl><small>人物介绍为本站创作设定；暂定名可修改。</small></div><div id="pane-related" class="pane" role="tabpanel" aria-labelledby="tab-related" hidden><div id="related-list"></div></div></div><div class="profile-actions"><button id="motion" class="primary" aria-pressed="false">开启重力视差</button><button id="share">分享角色</button><button id="compare">对比</button></div><p id="motion-status" class="hint">轻轻倾斜手机，让画面随你移动。</p><div class="profile-extras"><button id="voice-diary">♫ 语音日记</button><button id="collapse-profile" aria-expanded="true">收起手记</button></div></article></section>
<section class="gallery-section"><div class="section-heading"><div><h2>她的光影片段</h2><p id="gallery-desc"></p></div><button id="show-gallery">查看全部原图</button></div><div id="gallery" class="gallery"></div></section></div>
<section id="route-view" hidden aria-live="polite"></section>
<footer><span>晴间来信</span><p>一些相遇，值得慢慢看。</p><button id="virtual-online">✧ 虚拟相遇</button></footer></main>
<nav class="mobile-bar" aria-label="快捷操作"><button id="mobile-art">⤢ 鉴赏</button><button id="mobile-favorite">♡ 收藏</button><button id="music">♫ 音景</button><button id="mobile-explore">✧ 探索</button></nav>
<dialog id="viewer" aria-label="原图鉴赏"><div class="viewer-head"><span id="viewer-title"></span><button id="close-viewer" aria-label="关闭鉴赏">关闭 ×</button></div><div id="viewer-area"><span class="film-loader" aria-hidden="true"></span><img id="viewer-img" alt=""><p id="viewer-error" hidden>原图加载失败。<button id="viewer-retry">重试</button></p></div><div id="danmaku" aria-hidden="true"></div><div id="floating-cards" hidden></div><div class="viewer-bottom"><button id="viewer-prev" aria-label="上一张原图">‹</button><span id="viewer-count"></span><button id="viewer-next" aria-label="下一张原图">›</button><button id="zoom">放大</button><button id="immersive" aria-pressed="false">◆ 沉浸</button><button id="card-mode" aria-pressed="false">卡片模式</button><a id="download" download>保存原图</a><button id="fullscreen">全屏</button></div></dialog>
<dialog id="drawer" aria-labelledby="drawer-title"><div class="drawer-head"><h2 id="drawer-title"></h2><button id="close-drawer" aria-label="关闭面板">关闭 ×</button></div><div id="drawer-body"></div></dialog>
<dialog id="story-slider" aria-label="故事滑动"><button id="close-slider" aria-label="退出故事滑动">退出 ×</button><div id="slider-stage"></div><div class="slider-bottom"><button id="slider-prev">上一位</button><span id="slider-count"></span><button id="slider-next">下一位</button><button id="slider-detail">查看档案</button></div></dialog>
<div id="toast" role="status" aria-live="polite"></div><noscript>请开启 JavaScript 以浏览完整图鉴。<a href="assets/TT%20Image%202.5_1789747697011_0.png">查看小叶子的原图</a></noscript></body></html>
