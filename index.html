<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6fafd"><meta name="description" content="晴间来信，一本可以随身携带的角色与光影图鉴。"><title>晴间来信 · 角色图鉴</title><link rel="stylesheet" href="style.css"><script src="characters.js" defer></script><script src="app.js" defer></script></head>
<body><header class="header"><a href="#leaf" class="brand"><span class="brand-mark">晴</span><span>晴间来信<small>把喜欢的瞬间，留在这里。</small></span></a><div class="header-actions"><button id="collection">♡ <span>收藏</span><b id="count">0</b></button><button id="settings" aria-label="打开阅读设置">☷ <span>设置</span></button></div></header>
<main><div class="intro"><p>在光落下的地方，遇见你。</p><span>角色与光影的私人收藏册</span></div><nav id="characters" role="tablist" aria-label="选择角色"></nav>
<section class="stage" id="character-panel" role="tabpanel" aria-label="角色详情"><div class="art-wrap"><button class="art" id="open-art" aria-label="打开原图鉴赏"><img id="hero" fetchpriority="high" alt=""><span class="art-shade"></span><span class="art-caption"><span id="scene"></span><small>轻触画面 · 沉浸鉴赏</small></span><span class="view-mark">⤢</span></button><div class="image-error" hidden>画面暂未载入，请检查图片文件后重试。<button id="retry">重新加载</button></div><div class="art-footer"><span id="image-count"></span><div><button id="prev" aria-label="上一幅">‹</button><button id="next" aria-label="下一幅">›</button></div></div></div>
<article class="profile"><div class="profile-top"><span id="mood"></span><button id="favorite" aria-label="收藏角色" aria-pressed="false">♡</button></div><h1 id="name"></h1><p id="subtitle" class="subtitle"></p><blockquote id="quote"></blockquote><div class="content-tabs" role="tablist" aria-label="档案内容"><button role="tab" aria-selected="true" data-pane="story" id="tab-story" aria-controls="pane-story">角色手记</button><button role="tab" aria-selected="false" data-pane="details" id="tab-details" aria-controls="pane-details" tabindex="-1">印象档案</button></div><div id="pane-story" class="pane" role="tabpanel" aria-labelledby="tab-story"><p id="story"></p><div id="tags"></div></div><div id="pane-details" class="pane" role="tabpanel" aria-labelledby="tab-details" hidden><dl id="details"></dl><small>人物介绍为本站创作设定；暂定名可在配置中修改。</small></div><div class="profile-actions"><button id="motion" class="primary" aria-pressed="false">开启重力视差</button><button id="share">分享角色</button></div><p id="motion-status" class="hint">轻轻倾斜手机，让画面随你移动。</p></article></section>
<section class="gallery-section"><div class="section-heading"><div><h2>她的光影片段</h2><p id="gallery-desc"></p></div><button id="show-gallery">查看全部原图</button></div><div id="gallery" class="gallery"></div></section>
<footer><span>晴间来信</span><p>一些相遇，值得慢慢看。</p><small>图片来自站主提供的角色作品。</small></footer></main>
<nav class="mobile-bar" aria-label="快捷操作"><button id="mobile-art">⤢ 鉴赏</button><button id="mobile-favorite">♡ 收藏角色</button><button id="mobile-motion">◈ 重力视差</button></nav>
<dialog id="viewer"><div class="viewer-head"><span id="viewer-title"></span><button id="close-viewer" aria-label="关闭鉴赏">关闭 ×</button></div><div id="viewer-area"><img id="viewer-img" alt=""></div><div class="viewer-bottom"><button id="viewer-prev" aria-label="上一张原图">‹</button><span id="viewer-count"></span><button id="viewer-next" aria-label="下一张原图">›</button><button id="zoom">放大</button><a id="download" download>保存原图</a><button id="fullscreen">全屏</button></div></dialog>
<dialog id="drawer"><div class="drawer-head"><h2 id="drawer-title"></h2><button id="close-drawer" aria-label="关闭面板">关闭 ×</button></div><div id="drawer-body"></div></dialog><div id="toast" role="status" aria-live="polite"></div><noscript>请开启 JavaScript 以浏览角色图鉴。</noscript></body></html>
